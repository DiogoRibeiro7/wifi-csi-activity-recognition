name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run tests
        run: pytest -q --cov=wifi_activity_recognition --cov-report=term-missing

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run unit tests
        run: pytest -q -m unit

  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run regression tests
        run: pytest -q -m regression

  functional-tests:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run functional tests
        run: pytest -q -m functional

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run end-to-end tests
        run: pytest -q -m e2e

  wheel:
    name: Wheel build and clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      # A bare `import wifi_activity_recognition` is NOT a sufficient check: the
      # package resolves submodules lazily via __getattr__, so a wheel missing
      # every subpackage still imports cleanly. Assert on wheel contents and
      # import the submodules explicitly.
      - name: Assert wheel contains all subpackages
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = [
              "datasets", "features", "hardware", "inference", "models",
              "multimodal", "preprocessing", "research", "training", "utils",
              "training/federated",
          ]
          missing = [
              pkg for pkg in expected
              if f"wifi_activity_recognition/{pkg}/__init__.py" not in names
          ]
          if missing:
              sys.exit(f"wheel {wheel} is missing subpackages: {missing}")
          print(f"{wheel}: {len([n for n in names if n.endswith('.py')])} modules, all subpackages present")
          PY

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          # CPU-only torch: the default PyPI build drags in the CUDA stack and
          # costs hundreds of MB per run for no benefit here. torchvision is
          # required too -- models/resnet.py imports it at module scope, and
          # models/__init__.py reaches it lazily via serialization -> ensemble.
          /tmp/clean/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"

      # Runs from /tmp so the import resolves to the installed wheel and cannot
      # silently fall through to the source tree in the workspace.
      - name: Import every subpackage from the installed wheel
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python - <<'PY'
          import importlib
          import sys

          import wifi_activity_recognition as pkg

          if "/tmp/clean/" not in pkg.__file__:
              sys.exit(f"resolved to {pkg.__file__}, not the installed wheel")

          modules = [
              "utils.config", "models.factory", "hardware.base",
              "preprocessing.filtering", "datasets.loaders",
              "features.spectrogram", "inference.predictor",
              "research.domain_adaptation", "multimodal.fusion_strategies",
              "training.federated.server", "models.transformer",
              "datasets.public_datasets",
          ]
          for name in modules:
              importlib.import_module(f"wifi_activity_recognition.{name}")
              print("ok", name)
          PY

      - name: Smoke test console scripts
        run: |
          /tmp/clean/bin/wifi-har-train --help
          /tmp/clean/bin/wifi-har-predict --help
          /tmp/clean/bin/wifi-har-stream --help

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html

  quality:
    name: Lint and format (non-blocking)
    runs-on: ubuntu-latest
    # The pre-commit config was previously named `pre-commit-config.yml`, so
    # these hooks have never run against the tree. Kept non-blocking until the
    # existing backlog is cleared; flip to blocking once it reports clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run pre-commit
        run: pre-commit run --all-files
