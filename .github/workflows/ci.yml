name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run tests
        run: pytest -q --cov=wifi_activity_recognition --cov-report=term-missing

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run unit tests
        run: pytest -q -m unit

  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run regression tests
        run: pytest -q -m regression

  functional-tests:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run functional tests
        run: pytest -q -m functional

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run end-to-end tests
        run: pytest -q -m e2e

  wheel:
    name: Wheel build and clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      # A bare `import wifi_activity_recognition` is NOT a sufficient check: the
      # package resolves submodules lazily via __getattr__, so a wheel missing
      # every subpackage still imports cleanly. Assert on wheel contents and
      # import the submodules explicitly.
      - name: Assert wheel contains all subpackages
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = [
              "datasets", "features", "hardware", "inference", "models",
              "multimodal", "preprocessing", "research", "training", "utils",
              "training/federated",
          ]
          missing = [
              pkg for pkg in expected
              if f"wifi_activity_recognition/{pkg}/__init__.py" not in names
          ]
          if missing:
              sys.exit(f"wheel {wheel} is missing subpackages: {missing}")
          print(f"{wheel}: {len([n for n in names if n.endswith('.py')])} modules, all subpackages present")
          PY

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          # CPU-only torch: the default PyPI build drags in the CUDA stack and
          # costs hundreds of MB per run for no benefit here. torchvision is
          # required too -- models/resnet.py imports it at module scope, and
          # models/__init__.py reaches it lazily via serialization -> ensemble.
          /tmp/clean/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"

      # Runs from /tmp so the import resolves to the installed wheel and cannot
      # silently fall through to the source tree in the workspace.
      - name: Import every subpackage from the installed wheel
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python - <<'PY'
          import importlib
          import sys

          import wifi_activity_recognition as pkg

          if "/tmp/clean/" not in pkg.__file__:
              sys.exit(f"resolved to {pkg.__file__}, not the installed wheel")

          modules = [
              "utils.config", "models.factory", "hardware.base",
              "preprocessing.filtering", "datasets.loaders",
              "features.spectrogram", "inference.predictor",
              "research.domain_adaptation", "multimodal.fusion_strategies",
              "training.federated.server", "models.transformer",
              "datasets.public_datasets",
          ]
          for name in modules:
              importlib.import_module(f"wifi_activity_recognition.{name}")
              print("ok", name)
          PY

      - name: Smoke test console scripts
        run: |
          /tmp/clean/bin/wifi-har-train --help
          /tmp/clean/bin/wifi-har-predict --help
          /tmp/clean/bin/wifi-har-stream --help

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  deployment:
    name: Container build and run
    runs-on: ubuntu-latest
    # The one deployment flow verified end to end. The prod image previously
    # ran `python -m wifi_activity_recognition` with no __main__ module, so it
    # exited on start; nothing built or ran the image to notice.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: prod
          tags: wifi-activity-recognition:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start and do something, not merely build.
      - name: Container runs its default command
        run: docker run --rm wifi-activity-recognition:ci

      - name: Package is importable inside the image
        run: |
          docker run --rm wifi-activity-recognition:ci \
            python -c "import wifi_activity_recognition as w; print(w.__version__)"

      # Guards the defect this job exists for: the package must be installed,
      # not merely present as source under WORKDIR.
      - name: Console scripts are installed in the image
        run: |
          docker run --rm wifi-activity-recognition:ci wifi-har-train --help
          docker run --rm wifi-activity-recognition:ci wifi-har-predict --help
          docker run --rm wifi-activity-recognition:ci wifi-har-stream --help

      - name: Resolve outside the source tree
        run: |
          docker run --rm --workdir / wifi-activity-recognition:ci \
            python -c "import wifi_activity_recognition as w; print(w.__file__)"

      - name: Kubernetes liveness probe command succeeds in the image
        run: |
          docker run --rm wifi-activity-recognition:ci \
            python -m wifi_activity_recognition --version

      - name: Build the edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: edge
          tags: wifi-activity-recognition:ci-edge
          load: true
          cache-from: type=gha

      - name: Edge image runs
        run: docker run --rm wifi-activity-recognition:ci-edge

      - name: Kubernetes manifest is valid
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/yannh/kubeconform:latest \
            -strict -summary deployment/kubernetes/deployment.yaml

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html

  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    # Blocking. The backlog this job was waiting on is cleared: black, isort,
    # flake8, bandit, pydocstyle and the whitespace hooks all report clean.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      - name: Run pre-commit
        run: pre-commit run --all-files

  types:
    name: Type check (non-blocking)
    runs-on: ubuntu-latest
    # Reports without gating. mypy finds 245 errors across 49 files in the
    # package at the strict settings in pyproject.toml -- real annotation work,
    # tracked in docs/lint_status.md, and far more than a formatting pass
    # should absorb. Kept visible so the number can be driven down rather than
    # forgotten. Flip to blocking once it reports clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs,torch]
      # Run against the installed dependencies rather than a bare hook
      # environment: without numpy, torch and click present, mypy reports
      # missing-stub artefacts instead of genuine type errors.
      - name: Run mypy against the package
        run: mypy wifi_activity_recognition --ignore-missing-imports --no-strict-optional
