# Port mappings were removed from every service: nothing in this package binds
# a socket, so publishing 8080 advertised a listener that does not exist. Add
# them back alongside a real server interface -- see docs/deployment_status.md.
services:
  dev:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: dev
    volumes:
      - ../../:/app
    environment:
      - APP_ENV=development

  prod:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: prod
    environment:
      - APP_ENV=production

  edge:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: edge
    # Passing the whole /dev tree through is what a real CSI capture device
    # would need; harmless when no device is attached.
    devices:
      - "/dev:/dev"
    environment:
      - APP_ENV=edge
