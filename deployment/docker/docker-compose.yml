version: '3.8'

services:
  dev:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: dev
    volumes:
      - ../../:/app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development

  prod:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: prod
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production

  edge:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      target: edge
    devices:
      - "/dev:/dev"
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=edge
