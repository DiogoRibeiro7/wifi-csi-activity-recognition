apiVersion: apps/v1
kind: Deployment
metadata:
  name: wifi-activity-recognition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wifi-activity-recognition
  template:
    metadata:
      labels:
        app: wifi-activity-recognition
    spec:
      containers:
        - name: app
          image: wifi-activity-recognition:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
